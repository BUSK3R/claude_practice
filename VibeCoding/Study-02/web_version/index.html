<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 왼쪽 사이드바: 제목, 날짜, 진행률, 필터, 일괄 삭제 -->
    <aside class="sidebar">
      <header class="app-header">
        <h1>할 일 관리</h1>
        <p id="today" class="today"></p>
      </header>

      <section class="progress" aria-label="진행률">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text">0 / 0 완료 (0%)</p>
      </section>

      <nav class="filter-tabs" aria-label="카테고리 필터">
        <button type="button" class="filter-btn active" data-filter="all">전체</button>
        <button type="button" class="filter-btn" data-filter="work">업무</button>
        <button type="button" class="filter-btn" data-filter="personal">개인</button>
        <button type="button" class="filter-btn" data-filter="study">공부</button>
      </nav>

      <footer class="app-footer">
        <button type="button" id="clear-completed" class="clear-btn">완료 항목 모두 삭제</button>
      </footer>
    </aside>

    <!-- 오른쪽 본문: 입력 폼과 목록 -->
    <div class="content">
      <p id="storage-warning" class="storage-warning" role="alert" hidden>저장이 되지 않아요</p>

      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="할 일을 입력하세요"
          maxlength="100"
          autocomplete="off"
        />
        <select id="category-select" class="category-select" aria-label="카테고리">
          <option value="auto">자동 분류</option>
          <option value="work">업무</option>
          <option value="personal">개인</option>
          <option value="study">공부</option>
        </select>
        <button type="submit" class="add-btn">추가</button>
      </form>

      <main class="todo-main">
        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-state" class="empty-state">할 일이 없어요. 위에서 추가해 보세요.</p>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
